name: Windows probe

# Só verifica quais elementos GStreamer existem no MSYS2 ucrt64. Não gera release.
on:
  workflow_dispatch:
  push:
    branches: [windows-probe]

jobs:
  probe:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-rs
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-gst-python
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-python-gobject

      - name: Versões
        run: |
          gst-inspect-1.0 --version
          python --version
          pacman -Q | grep -E "gstreamer|gst-plugins|gtk4|python-gobject|gst-python"

      - name: Elementos que o LUCE usa
        run: |
          for e in whipsink whepsrc whipclientsink whepclientsrc gtk4paintablesink \
                   d3d11screencapturesrc d3d12screencapturesrc \
                   nvh264enc nvd3d11h264enc amfh264enc qsvh264enc mfh264enc x264enc \
                   nvh264dec d3d11h264dec avdec_h264 \
                   wasapi2src opusenc rtpopuspay rtph264pay h264parse \
                   videorate glupload glcolorconvert d3d11convert d3d11download; do
            if gst-inspect-1.0 "$e" >/dev/null 2>&1; then echo "OK      $e"; else echo "FALTA   $e"; fi
          done

      - name: Propriedades do wasapi2src
        run: |
          gst-inspect-1.0 wasapi2src | grep -iE "loopback|low-latency|device" || echo "wasapi2src sem as propriedades"

      - name: Propriedades do d3d11screencapturesrc
        run: |
          gst-inspect-1.0 d3d11screencapturesrc | grep -iE "monitor|window|handle|show-cursor|framerate" || true

      - name: Python importa Gst e Gtk
        run: |
          python - <<'PY'
          import gi
          gi.require_version("Gst", "1.0"); gi.require_version("Gtk", "4.0")
          from gi.repository import Gst, Gtk
          Gst.init(None)
          print("Gst", Gst.version_string(), "| Gtk", Gtk.get_major_version(), Gtk.get_minor_version())
          print("gtk4paintablesink:", Gst.ElementFactory.find("gtk4paintablesink") is not None)
          PY

      - name: DLLs dos plugins de GPU (elementos só registram com driver)
        run: |
          ls /ucrt64/lib/gstreamer-1.0 | grep -iE "nvcodec|amfcodec|qsv|d3d11|d3d12|mediafoundation|wasapi2|rswebrtc|webrtchttp|gtk4|x264|libav" || true
          echo "--- elementos do plugin d3d11 / mediafoundation / wasapi2 sem GPU:"
          gst-inspect-1.0 d3d11 | grep -E "^\s+[a-z0-9]+:" || true
          gst-inspect-1.0 mediafoundation | grep -E "^\s+[a-z0-9]+:" || true
          echo "--- nvcodec / amfcodec / qsv:"
          gst-inspect-1.0 nvcodec 2>&1 | head -20 || true
          gst-inspect-1.0 amfcodec 2>&1 | head -5 || true
          gst-inspect-1.0 qsv 2>&1 | head -5 || true

      - name: Enum do loopback-mode e propriedades do whipclientsink
        run: |
          gst-inspect-1.0 wasapi2src | grep -A6 "GstWasapi2SrcLoopbackMode"
          gst-inspect-1.0 whipclientsink | grep -E "signaller|video-caps|congestion|use-link-headers|auth-token|whip-endpoint|ice-" || true

      - name: d3d11screencapturesrc completo
        run: |
          gst-inspect-1.0 d3d11screencapturesrc
          echo "--- d3d12screencapturesrc:"
          gst-inspect-1.0 d3d12screencapturesrc | sed -n '/Element Properties/,$p'
          echo "--- x264enc / openh264enc:"
          gst-inspect-1.0 x264enc >/dev/null 2>&1 && echo "OK x264enc" || echo "FALTA x264enc"
          gst-inspect-1.0 openh264enc >/dev/null 2>&1 && echo "OK openh264enc" || echo "FALTA openh264enc"
          echo "--- wasapi2src enum:"
          gst-inspect-1.0 wasapi2src | sed -n '/loopback-mode/,/loopback-target-pid/p'

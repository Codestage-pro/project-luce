name: Windows probe

# Só verifica quais elementos GStreamer existem no MSYS2 ucrt64. Não gera release.
on:
  workflow_dispatch:
  push:
    branches: [windows-probe]

jobs:
  probe:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-rs
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-gst-python
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-python-gobject

      - name: Versões
        run: |
          gst-inspect-1.0 --version
          python --version
          pacman -Q | grep -E "gstreamer|gst-plugins|gtk4|python-gobject|gst-python"

      - name: Elementos que o LUCE usa
        run: |
          for e in whipsink whepsrc whipclientsink whepclientsrc gtk4paintablesink \
                   d3d11screencapturesrc d3d12screencapturesrc \
                   nvh264enc nvd3d11h264enc amfh264enc qsvh264enc mfh264enc x264enc \
                   nvh264dec d3d11h264dec avdec_h264 \
                   wasapi2src opusenc rtpopuspay rtph264pay h264parse \
                   videorate glupload glcolorconvert d3d11convert d3d11download; do
            if gst-inspect-1.0 "$e" >/dev/null 2>&1; then echo "OK      $e"; else echo "FALTA   $e"; fi
          done

      - name: Propriedades do wasapi2src
        run: |
          gst-inspect-1.0 wasapi2src | grep -iE "loopback|low-latency|device" || echo "wasapi2src sem as propriedades"

      - name: Propriedades do d3d11screencapturesrc
        run: |
          gst-inspect-1.0 d3d11screencapturesrc | grep -iE "monitor|window|handle|show-cursor|framerate" || true

      - name: Python importa Gst e Gtk
        run: |
          python - <<'PY'
          import gi
          gi.require_version("Gst", "1.0"); gi.require_version("Gtk", "4.0")
          from gi.repository import Gst, Gtk
          Gst.init(None)
          print("Gst", Gst.version_string(), "| Gtk", Gtk.get_major_version(), Gtk.get_minor_version())
          print("gtk4paintablesink:", Gst.ElementFactory.find("gtk4paintablesink") is not None)
          PY

      - uses: actions/checkout@v4

      - name: Cadeia D3D11 -> x264 (sem GPU, só confere o encaixe)
        continue-on-error: true
        run: |
          gst-launch-1.0 -e d3d11testsrc num-buffers=30 ! "video/x-raw(memory:D3D11Memory),framerate=30/1" \
            ! d3d11convert ! "video/x-raw(memory:D3D11Memory),format=NV12,width=1280,height=720" \
            ! d3d11download ! x264enc tune=zerolatency ! h264parse ! fakesink

      - name: Monitores (winsys) e imports do app sem dbus
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys
          print("platform", sys.platform)
          from luce import winsys
          print("monitores:", winsys.list_monitors())
          import luce.gui, luce.watch_pipeline, luce.__main__
          print("imports ok")
          PY

      - name: CapturePipeline monta no Windows (D3D11 + wasapi2src)
        continue-on-error: true
        env:
          LUCE_ENCODER: x264enc
        run: |
          python - <<'PY'
          from luce.capture_pipeline import CapturePipeline
          p = CapturePipeline("http://127.0.0.1:1/x/whip", width=1280, height=720, fps=30, preview=False)
          a = p.pipeline.get_by_name("audio-src")
          print("encoder:", p.encoder_kind)
          print("loopback:", a.get_property("loopback"), "| modo:", a.get_property("loopback-mode").value_nick,
                "| pid:", a.get_property("loopback-target-pid"))
          print("elementos:", sorted(e.get_name() for e in p.pipeline.children))
          PY

      - name: CapturePipeline com preview (ramo D3D11 -> download -> appsink)
        continue-on-error: true
        env:
          LUCE_ENCODER: x264enc
        run: |
          python - <<'PY'
          from luce.capture_pipeline import CapturePipeline
          p = CapturePipeline("http://127.0.0.1:1/x/whip", fps=60, preview_sink=lambda: None)
          print("ok:", sorted(e.get_name() for e in p.pipeline.children))
          PY

      - name: Captura de verdade por 3 s (runner sem GPU, pode falhar)
        continue-on-error: true
        run: |
          timeout 20 gst-launch-1.0 -e d3d11screencapturesrc num-buffers=60 ! d3d11convert ! d3d11download ! fakesink 2>&1 | tail -15

      - name: Captura de janela (WGC + áudio por PID)
        run: python packaging/windows/ci_window_test.py

name: Windows headers probe

# Só verifica se o g++ do MSYS2 compila WGC. Não gera release.
on:
  workflow_dispatch:
  push:
    branches: [windows-probe]
    paths: [.github/workflows/windows-headers.yml]

jobs:
  headers:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - run: |
          cat > test_wgc.cpp << 'CPP'
          #define CINTERFACE
          #include <windows.h>
          #include <winstring.h>
          #include <roapi.h>
          #include <d3d11.h>
          #include <dxgi1_2.h>
          #include <windows.graphics.capture.h>
          #include <windows.graphics.capture.interop.h>
          #include <windows.graphics.directx.direct3d11.h>
          #include <windows.graphics.directx.direct3d11.interop.h>
          #include <wrl/client.h>

          using namespace Microsoft::WRL;
          using namespace ABI::Windows::Graphics::Capture;
          using namespace ABI::Windows::Graphics::DirectX;
          using namespace ABI::Windows::Graphics::DirectX::Direct3D11;

          extern "C" __declspec(dllexport) int test_compile() {
              ComPtr<IGraphicsCaptureItemInterop> interop;
              ComPtr<IDirect3D11CaptureFramePoolStatics2> pool_statics;
              return 0;
          }
          CPP
          g++ -shared -O2 test_wgc.cpp -o test_wgc.dll -ld3d11 -ldxgi -lole32
          ls -l test_wgc.dll

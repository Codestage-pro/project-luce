name: Windows headers probe

# Testa compilação do luce_wgc.dll e chamada Python. Não gera release.
on:
  workflow_dispatch:
  push:
    branches: [windows-probe]
    paths: [.github/workflows/windows-headers.yml, luce/windows/wgc_capture.cpp]

jobs:
  wgc-build-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - run: |
          g++ -O2 -shared luce/windows/wgc_capture.cpp -o luce_wgc.dll -ld3d11 -ldxgi -lole32
          ls -lh luce_wgc.dll
          python -c "import ctypes; lib = ctypes.CDLL('./luce_wgc.dll'); print('wgc supported:', lib.luce_wgc_is_supported())"

name: Windows build

# Monta o app para Windows (bundle portátil .zip + instalador Inno Setup).
#  - push na windows-probe: atualiza a Prerelease "windows-test" (download direto, sem login)
#  - tag v*: anexa o Luce-Setup.exe e o Luce-portable.zip na Release oficial (a do Flatpak)
on:
  workflow_dispatch:
  push:
    branches: [windows-probe]
    tags: ["v*"]
    paths:
      - luce/**
      - packaging/**
      - .github/workflows/windows-build.yml

permissions:
  contents: write  # criar/atualizar a Release e mover a tag windows-test

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            pacman-contrib
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-plugins-rs
            mingw-w64-ucrt-x86_64-gst-plugins-ugly
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-gst-python
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-python-gobject

      - name: Monta o bundle (só o runtime de que o app precisa)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          out=dist/LUCE
          mkdir -p "$out"
          tops="gstreamer gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugins-rs gst-plugins-ugly gst-python gtk4 python-gobject"
          for t in $tops; do pactree -u -l "mingw-w64-ucrt-x86_64-$t"; done | sort -u > pkgs.txt
          echo "$(wc -l < pkgs.txt) pacotes"
          # só arquivos (pacman -Ql lista pastas com / no fim), sem o que só serve para compilar ou documentar
          xargs -a pkgs.txt pacman -Ql | awk '{print $2}' | grep -v '/$' \
            | grep -Ev '^/ucrt64/(include|share/(doc|man|info|gtk-doc|aclocal|gir-1\.0|bash-completion|vala|gdb|licenses|pkgconfig|cmake)|lib/(pkgconfig|cmake))/' \
            | grep -Ev '\.(a|la|h|hpp|def|pdb)$' \
            | grep -Ev '^/ucrt64/share/locale/' \
            | grep -Ev '/(tests?|idlelib|turtledemo|__pycache__)/' \
            | sed 's|^/||' | sort -u > files.txt
          # o idioma do app é pt-BR: mantém só a tradução dele
          xargs -a pkgs.txt pacman -Ql | awk '{print $2}' | grep -E '^/ucrt64/share/locale/pt_BR/' | grep -v '/$' | sed 's|^/||' >> files.txt
          # alguns pacotes listam arquivos que não existem (links soltos): fora
          while read -r f; do [ -e "/$f" ] && echo "$f"; done < files.txt | sort -u > present.txt
          (cd / && tar -T "$OLDPWD/present.txt" -cf -) | tar -C "$out" -xf -
          cp -r luce "$out/luce"
          cp packaging/windows/luce_launcher.pyw packaging/windows/luce.ico "$out/"
          # luce.exe = cópia do pythonw.exe: o Gerenciador de Tarefas mostra nome/ícone do exe, não do script
          cp "$out/ucrt64/bin/pythonw.exe" "$out/ucrt64/bin/luce.exe"
          # tira plugins e DLLs que o app não usa (o bundle cai de ~900 MB para uma fração); o teste abaixo valida
          python packaging/windows/prune_bundle.py "$out"
          # o logo no cabeçalho do app vem do tema de ícones (mesmo nome do Linux)
          for n in 48 128 256; do
            install -Dm644 "packaging/windows/icons/$n.png" "$out/ucrt64/share/icons/hicolor/${n}x${n}/apps/pro.codestage.Luce.png"
          done
          find "$out" -name __pycache__ -type d -prune -exec rm -rf {} +
          # o registro do GStreamer nasce no PC da pessoa (winenv.py); o do runner nunca vai junto
          find "$out" \( -iname 'registry*.bin' -o -iname 'gst-registry*' \) -print -delete
          test -z "$(find "$out" -iname '*registry*.bin')"
          # sem .pyc o Python recompila stdlib, gi e luce a CADA abertura: em Arquivos de Programas o usuário comum não grava __pycache__
          python -m compileall -q -j 0 --invalidation-mode unchecked-hash "$out"/ucrt64/lib/python3.* "$out/luce"
          du -sh "$out"

      - name: Marca o luce.exe (nome e ícone no Gerenciador de Tarefas)
        shell: pwsh
        run: |
          choco install rcedit -y --no-progress | Out-Null
          rcedit dist\LUCE\ucrt64\bin\luce.exe --set-icon packaging\windows\luce.ico --set-version-string FileDescription "Project LUCE" --set-version-string ProductName "Project LUCE" --set-version-string InternalName "luce" --set-version-string OriginalFilename "luce.exe"
          if ($LASTEXITCODE -ne 0) { throw "rcedit falhou" }

      - name: Versão (o app compara com a última Release)
        shell: pwsh
        run: |
          $v = "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('1.0.22-probe.{0}', github.run_number) }}".TrimStart('v')
          Set-Content -NoNewline -Path dist\LUCE\version.txt -Value $v
          "LUCE_VERSION=$v" >> $env:GITHUB_ENV

      - name: Testa o bundle (python do bundle, PATH limpo, sem MSYS2)
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:LOCALAPPDATA = "$PWD\_localapp"
          $env:GST_PLUGIN_PATH = "C:\nao\existe"   # o winenv tem que ignorar GStreamer de fora
          & dist\LUCE\ucrt64\bin\python.exe packaging\windows\ci_bundle_test.py dist\LUCE
          if ($LASTEXITCODE -ne 0) { throw "teste do bundle falhou ($LASTEXITCODE)" }
          # o launcher do atalho (pythonw): luce --help grava o uso no luce.log
          $t = Measure-Command { Start-Process -Wait -FilePath dist\LUCE\ucrt64\bin\luce.exe -ArgumentList 'dist\LUCE\luce_launcher.pyw','--help' }
          "launcher --help: $([int]$t.TotalMilliseconds) ms"
          Get-Content "$env:LOCALAPPDATA\LUCE\luce.log" -TotalCount 5
          if (-not (Select-String -Path "$env:LOCALAPPDATA\LUCE\luce.log" -Pattern 'usage')) { throw "launcher não rodou" }

      - name: Zip portátil
        shell: pwsh
        run: 7z a -tzip -mx=5 -bso0 dist\Luce-portable.zip .\dist\LUCE\*

      - name: Instalador Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:LUCE_VERSION" packaging\windows\luce.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou" }
          Get-ChildItem dist\*.exe, dist\*.zip | Format-Table Name, @{n='MB';e={[int]($_.Length/1MB)}}

      # Artifacts separados (o Setup sozinho tem ~290 MB); o caminho normal de download são as Releases
      - uses: actions/upload-artifact@v6
        with:
          name: Luce-Setup-exe
          path: dist/Luce-Setup.exe
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: Luce-portable
          path: dist/Luce-portable.zip
          compression-level: 0
          retention-days: 14

      # Tag v*: anexa na Release oficial (cria se o workflow do Flatpak ainda não criou)
      - name: Anexa na Release oficial
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Luce-Setup.exe
            dist/Luce-portable.zip
          fail_on_unmatched_files: true

      # Branch: a tag windows-test anda para o commit deste build e a Prerelease é atualizada no lugar
      - name: Move a tag windows-test
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: |
          git tag -f windows-test ${{ github.sha }}
          git push -f origin windows-test
      - name: Atualiza a Prerelease windows-test
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: windows-test
          name: Windows (teste)
          body: |
            Build de teste do app para Windows, gerado a cada push na branch `windows-probe`.
            Baixe o `Luce-Setup.exe` (instalador) ou o `Luce-portable.zip` (sem instalar).
            Commit: ${{ github.sha }}
          prerelease: true
          make_latest: "false"
          files: |
            dist/Luce-Setup.exe
            dist/Luce-portable.zip
          fail_on_unmatched_files: true

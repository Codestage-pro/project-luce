name: Android build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
    branches:
      - main
      - windows-probe
    tags:
      - 'android-v*'
      - 'v*'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: false

      - name: Definir versão do build
        run: |
          if [[ "${{ github.ref }}" == refs/tags/android-v* ]]; then
            VER="${GITHUB_REF_NAME#android-v}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="1.0.45"
          fi
          echo "LUCE_VERSION=$VER" >> $GITHUB_ENV
          echo "Versão definida: $VER"

      - name: Garantir Keystore de Assinatura
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias luce \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass projectluce \
              -keypass projectluce \
              -dname "CN=Murilo Abreu, OU=Mobile, O=Codestage, L=Belo Horizonte, S=MG, C=BR"
          else
            echo "release.keystore já existe no repositório."
          fi

      - name: Compilar APK de Release
        working-directory: android
        env:
          LUCE_VERSION: ${{ env.LUCE_VERSION }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PluceVersion="${{ env.LUCE_VERSION }}" -PluceCode="${{ github.run_number }}" --no-configuration-cache --stacktrace

      - name: Preparar arquivo de distribuição
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Luce-Android.apk
          ls -lh dist/Luce-Android.apk

      - name: Salvar Artefato
        uses: actions/upload-artifact@v4
        with:
          name: Luce-Android-apk
          path: dist/Luce-Android.apk
          retention-days: 14

      # Tag v*: Anexa também na Release unificada da tag v*
      - name: Anexa na Release unificada v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Luce-Android.apk
          fail_on_unmatched_files: true

      # Tag oficial (v* ou android-v*): atualiza a Release oficial android-latest
      - name: Move a tag android-latest
        if: startsWith(github.ref, 'refs/tags/android-v') || startsWith(github.ref, 'refs/tags/v')
        run: |
          git tag -f android-latest ${{ github.sha }}
          git push -f origin android-latest

      - name: Atualiza a Release oficial android-latest
        if: startsWith(github.ref, 'refs/tags/android-v') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android (oficial)
          body: |
            Versão oficial do Project LUCE para Android.
            Versão: ${{ env.LUCE_VERSION }}
          prerelease: false
          files: dist/Luce-Android.apk
          fail_on_unmatched_files: true

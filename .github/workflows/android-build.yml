name: Android build

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
    branches:
      - main
      - windows-probe
    tags:
      - 'v*'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: false

      - name: Gerar Keystore de Assinatura
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias luce \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass projectluce \
            -keypass projectluce \
            -dname "CN=Project LUCE, OU=Codestage, O=Codestage, L=Curitiba, S=PR, C=BR"

      - name: Compilar APK de Release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Preparar arquivo de distribuição
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Luce-Android.apk
          ls -lh dist/Luce-Android.apk

      - name: Salvar Artefato
        uses: actions/upload-artifact@v4
        with:
          name: Luce-Android-apk
          path: dist/Luce-Android.apk
          retention-days: 14

      # Tag v*: Anexa na Release oficial do GitHub
      - name: Anexa na Release oficial
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Luce-Android.apk
          fail_on_unmatched_files: true

      # Branch push: Anexa na Prerelease de teste do Android
      - name: Move a tag android-test
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          git tag -f android-test ${{ github.sha }}
          git push -f origin android-test
      - name: Atualiza a Prerelease android-test
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: Android (teste)
          body: |
            Build de teste do app para Android, gerado a cada push em `main` ou `windows-probe`.
            Baixe o arquivo `Luce-Android.apk` para instalar diretamente no celular.
            Commit: ${{ github.sha }}
          prerelease: true
          make_latest: "false"
          files: dist/Luce-Android.apk
          fail_on_unmatched_files: true

# Servidor do Project LUCE (Dokploy ou qualquer docker compose): o proxy
# WHIP/WHEP -> Cloudflare Realtime SFU de sfu_proxy.py. Só HTTP: a mídia vai
# direto do cliente pro SFU, então não há porta UDP pra abrir.
#
# CF_SFU_APP_ID, CF_SFU_APP_SECRET e BDK_PASSWORD vêm de server/.env (ver
# .env.example). No Dokploy, cole as três na aba Environment do serviço.
#
# O cloudflared do host fala com 127.0.0.1:8889 (ingress no
# /etc/cloudflared/config.yml). Não configure domínio no Dokploy pra este
# serviço — o acesso é só pelo túnel.
services:
  luce:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8889:8889"

# Deploy no Dokploy (ou qualquer docker compose) como "servidor real", em vez
# do script local. Imagem oficial (bluenviron/mediamtx:1, ~16MB).
#
# network_mode: host é obrigatório aqui, não só mais simples — o
# mediamtx-tailscale.yml restringe os candidatos ICE à interface
# `tailscale0` (webrtcIPsFromInterfacesList), e com rede bridge (padrão do
# Docker) o container nem vê essa interface do host. Com host, as portas do
# mediamtx-tailscale.yml (9997 API, 8889 WebRTC, 8189 UDP) já saem direto no
# host, sem precisar de `ports:`.
#
# No Dokploy: crie o serviço como "Docker Compose" apontando pra esse
# arquivo (server/docker-compose.yml) — e NÃO configure domínio pra ele. Ao
# associar um domínio, o Dokploy injeta a dokploy-network no serviço, o que
# conflita com network_mode: host e a implantação falha (bug conhecido,
# fechado como "not planned": github.com/Dokploy/dokploy/issues/663). Sem
# domínio — acesso é direto pelo seu cloudflared (ver mediamtx-public.yml) —
# não tem esse problema.
#
# mediamtx-public.yml em vez de mediamtx-tailscale.yml: essa é a versão sem
# depender de amigo nenhum entrar no seu Tailscale — mídia relaiada pelo
# Cloudflare Realtime TURN (scripts/refresh-cloudflare-turn.sh, via cron,
# mantém as credenciais vivas) e sinalização exposta pelo cloudflared.
services:
  mediamtx:
    image: bluenviron/mediamtx:1
    network_mode: host
    restart: unless-stopped
    environment:
      # Senha do grupo (bdk) — override nativo do MediaMTX pra item de lista
      # (authInternalUsers[0].pass), lido de server/.env (ver .env.example).
      - MTX_AUTHINTERNALUSERS_0_PASS=${BDK_PASSWORD}
    volumes:
      - ./mediamtx-public.yml:/mediamtx.yml:ro

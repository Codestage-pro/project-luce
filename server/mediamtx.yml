# Relay local do Project LUCE (Fase 1 — loopback, sem TLS, sem auth).
# Chaves omitidas usam o padrão embutido do MediaMTX; só sobrescrevemos o
# necessário para WHIP/WHEP + roster via API.

logLevel: info

api: yes
apiAddress: 127.0.0.1:9997

rtsp: no
rtmp: no
hls: no
srt: no

webrtc: yes
webrtcAddress: 127.0.0.1:8889
webrtcLocalUDPAddress: 127.0.0.1:8189
webrtcEncryption: no
webrtcAllowOrigins: ["*"]
# Só loopback: com Tailscale ativo, candidatos ICE da interface tailscale0
# às vezes "ganham" a negociação e falham (não roteiam de fato pra
# localhost), deixando o WHEP instável. Na Fase 2 (LAN/Tailscale) isso
# precisa voltar pra lista de interfaces reais.
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: [127.0.0.1]

paths:
  all_others:

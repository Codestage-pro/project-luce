# Relay local do Project LUCE (Fase 1 — loopback, sem TLS, sem auth).
# Chaves omitidas usam o padrão embutido do MediaMTX; só sobrescrevemos o
# necessário para WHIP/WHEP + roster via API.

logLevel: info

api: yes
apiAddress: 127.0.0.1:9997

rtsp: no
rtmp: no
hls: no
srt: no

webrtc: yes
webrtcAddress: 127.0.0.1:8889
webrtcLocalUDPAddress: 127.0.0.1:8189
webrtcEncryption: no
webrtcAllowOrigins: ["*"]
# Só loopback: qualquer VPN/interface extra ativa na máquina pode fazer o
# MediaMTX anunciar um candidato ICE dessa interface que
# "ganha" a negociação e falha (não roteia de fato pra localhost), deixando
# o WHEP instável nesse teste local.
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: [127.0.0.1]

paths:
  all_others:

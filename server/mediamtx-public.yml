# Relay "servidor real" acessível pela internet: a sinalização HTTP
# (WHIP/WHEP/API) passa pelo seu cloudflared (ver
# /etc/cloudflared/config.yml no notebook — ingress apontando pra
# http://127.0.0.1:8889 e http://127.0.0.1:9997) e a mídia (RTP/ICE) relaia
# pelo Cloudflare Realtime TURN. O bloco CLOUDFLARE_TURN abaixo é preenchido
# por scripts/refresh-cloudflare-turn.sh (credenciais do Cloudflare expiram
# em até 48h, não dá pra deixar fixo).
#
# Rede aberta pra internet (sem VPN restringindo quem alcança o servidor),
# publish/read ficam abertos pra qualquer um que descobrir a URL — por isso
# exigem senha (authInternalUsers abaixo). A senha de verdade entra por
# variável de ambiente (MTX_AUTHINTERNALUSERS_0_PASS, ver
# server/docker-compose.yml + server/.env.example), não fica commitada aqui;
# é o mesmo valor que vai em auth_password no config.toml de quem vai usar
# (ver luce/config.py).

logLevel: info

api: yes
apiAddress: :9997

rtsp: no
rtmp: no
hls: no
srt: no
moq: no

webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
webrtcEncryption: no
webrtcAllowOrigins: ["*"]
# Sem interface nenhuma: a mídia só sai pelo relay do Cloudflare TURN abaixo,
# então não precisa (e não deve) anunciar a IP real do servidor como
# candidato ICE. webrtcAdditionalHosts só está preenchido porque o MediaMTX
# exige um dos dois não-vazio (erro "at least one between
# 'webrtcIPsFromInterfaces' or 'webrtcAdditionalHosts' must be filled"); esse
# host candidate nem é alcançável de fora (porta UDP não exposta publicamente
# — só o cloudflared pra HTTP), então o ICE sempre cai pro candidato do TURN.
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts: ["luce.codestage.pro"]
webrtcICEServers2:
  - url: stun:stun.cloudflare.com:3478
  # BEGIN CLOUDFLARE_TURN (gerado por scripts/refresh-cloudflare-turn.sh, não edite à mão)
  # END CLOUDFLARE_TURN

# Só o cloudflared local (mesma máquina) fala com a API — ele é quem expõe
# a /v3/paths/list pro domínio público, então IP de fora nunca chega aqui
# direto; por isso a action "api" continua liberada só pra loopback, sem
# senha.
authInternalUsers:
  - user: bdk
    pass: ""  # via MTX_AUTHINTERNALUSERS_0_PASS (docker-compose.yml + server/.env)
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics
      - action: pprof

paths:
  all_others:

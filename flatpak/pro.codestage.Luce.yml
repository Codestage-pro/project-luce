app-id: pro.codestage.Luce
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: luce

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # pw-dump (lista do áudio de cada app) e o pipewiresrc com target-object falam direto com o
  # PipeWire; só o socket do PulseAudio não basta.
  - --filesystem=xdg-run/pipewire-0
  # GPU: NVENC/NVDEC (extensão NVIDIA do Flatpak) e VA-API (Mesa). A captura de tela
  # vem do portal (xdg-desktop-portal), que já é acessível por padrão.
  - --device=dri

modules:
  # O runtime GNOME 51 tem GStreamer 1.28 com gtk4paintablesink, nvcodec e va, mas não
  # o whipsink/whepsrc (gst-plugins-rs) nem o ximagesrc (gst-plugins-good sem X11).
  - name: gst-plugin-webrtchttp
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      build-args:
        - --share=network  # cargo baixa as crates; ok pro nosso repositório, a Flathub não aceitaria
      env:
        CARGO_HOME: /run/build/gst-plugin-webrtchttp/cargo
    build-commands:
      - cargo build --release -p gst-plugin-webrtchttp
      - install -Dm755 target/release/libgstwebrtchttp.so /app/lib/gstreamer-1.0/libgstwebrtchttp.so
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/gstreamer/gst-plugins-rs.git
        tag: 0.15.4  # série 0.15 casa com GStreamer 1.28 do runtime
        commit: 1afff3711855238433862c0ce3bf34918e500386

  - name: gst-ximagesrc
    buildsystem: meson
    config-opts:
      - -Dauto_features=disabled
      - -Dximagesrc=enabled
      - -Dximagesrc-xshm=enabled
      - -Dximagesrc-xfixes=enabled
      - -Dximagesrc-xdamage=enabled
      - -Dtests=disabled
      - -Dexamples=disabled
      - -Ddoc=disabled
      - -Dnls=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.28.6.tar.xz
        sha256: b0c620a4b18b6ee931b4c43bbf1760d308666dc37f730a7e7f1ad327e59ce2df

  - name: python-dbus
    buildsystem: meson
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/f3/cc/23f24bc7cbfec3a0ab508b7e11bc98837d77a91445d5f666a8545353a147/dbus_python-1.5.1.tar.gz
        sha256: 57423cf87d09b7d084f420b55b737fe654c33339b06df77945620d97795c6ac4

  - name: luce
    buildsystem: simple
    build-commands:
      - install -d /app/share/project-luce
      - cp -r luce /app/share/project-luce/
      - find /app/share/project-luce -name __pycache__ -exec rm -rf {} +
      - install -Dm755 flatpak/luce-launcher.sh /app/bin/luce
      - install -Dm644 flatpak/config.toml /app/etc/project-luce/config.toml
      - install -Dm644 packaging/pro.codestage.Luce.desktop /app/share/applications/pro.codestage.Luce.desktop
      - install -Dm644 packaging/pro.codestage.Luce.svg /app/share/icons/hicolor/scalable/apps/pro.codestage.Luce.svg
      - install -Dm644 packaging/pro.codestage.Luce.metainfo.xml /app/share/metainfo/pro.codestage.Luce.metainfo.xml
    sources:
      - type: dir
        path: ..
        skip: [.git, graphify-out, server, auto.crt, auto.key, __pycache__, build-dir, repo, .flatpak-builder]

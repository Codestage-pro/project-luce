<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" role="img" aria-label="Project LUCE — transmissão de tela 100% GPU">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f"/><stop offset="0.55" stop-color="#0b0d24"/><stop offset="1" stop-color="#150a2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"><animate attributeName="stop-color" values="#00e5ff;#7c4dff;#ff2d95;#00e5ff" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ff2d95"><animate attributeName="stop-color" values="#ff2d95;#00e5ff;#7c4dff;#ff2d95" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7c4dff" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="4s" repeatCount="indefinite"/>
    </rect>

    <!-- pulso de dados atravessando o banner (o "stream") -->
    <g filter="url(#glow)" fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round">
      <path d="M0 330 H260 l24 -46 l30 92 l30 -70 l18 24 H1280" stroke-opacity="0.9"/>
      <path d="M0 330 H260 l24 -46 l30 92 l30 -70 l18 24 H1280" stroke="#ffffff" stroke-width="3" stroke-dasharray="40 1240">
        <animate attributeName="stroke-dashoffset" from="1280" to="-40" dur="3.2s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- pacotes -->
    <g fill="#00e5ff" filter="url(#glow)">
      <circle r="4" cy="330"><animate attributeName="cx" from="-20" to="1300" dur="5s" repeatCount="indefinite"/></circle>
      <circle r="3" cy="330" fill="#ff2d95"><animate attributeName="cx" from="-20" to="1300" dur="5s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle r="3" cy="330" fill="#7c4dff"><animate attributeName="cx" from="-20" to="1300" dur="5s" begin="3.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- título -->
    <g filter="url(#glow)">
      <text x="640" y="190" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','DejaVu Sans Mono',monospace" font-size="118" font-weight="800" letter-spacing="14" fill="url(#neon)">LUCE</text>
    </g>
    <text x="640" y="248" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="24" letter-spacing="9" fill="#cfd3ff">
      PROJECT <tspan fill="#00e5ff">·</tspan> TELA <tspan fill="#ff2d95">·</tspan> 100% GPU
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="640" y="288" text-anchor="middle" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="17" letter-spacing="3" fill="#8f94c9">NVENC · VA-API · x264 &#160;→&#160; WHIP/WHEP &#160;→&#160; Cloudflare SFU</text>

    <!-- scanline -->
    <rect width="1280" height="3" fill="#00e5ff" opacity="0.12">
      <animate attributeName="y" from="-10" to="410" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="1" y="1" width="1278" height="398" rx="27" fill="none" stroke="url(#neon)" stroke-width="2" opacity="0.8"/>
  </g>
</svg>
